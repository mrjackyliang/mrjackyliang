          NOVA_SUMMARY_ROW_2_DESTINATION: "GitHub Pages"
          NOVA_SUMMARY_ROW_2_DESTINATION_OUTPUT: "${{ needs['publish-github-pages-apps-website'].outputs.summary_destination_0 || '' }}"
          NOVA_SUMMARY_ROW_2_DETAIL_OUTPUT: "${{ needs['publish-github-pages-apps-website'].outputs.summary_detail_0 || '' }}"
          NOVA_SUMMARY_ROW_2_RESULT: "${{ needs['publish-github-pages-apps-website'].result }}"
          NOVA_SUMMARY_ROW_2_PUBLISH: "true"
          NOVA_SUMMARY_ROW_3_WORK: "Publish coverage badge"
