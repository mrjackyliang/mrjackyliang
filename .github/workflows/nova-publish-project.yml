          NOVA_SUMMARY_ROW_2_WORK_OUTPUT: "${{ needs['publish-github-pages-apps-website'].outputs.summary_work_0 || '' }}"
          NOVA_SUMMARY_ROW_2_WORKSPACE: "mrjackyliang-app-website"
