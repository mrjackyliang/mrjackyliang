          NOVA_SUMMARY_ROW_0_WORKSPACE: "mrjackyliang-app-website"
          NOVA_SUMMARY_ROW_0_DESTINATION: "GitHub Pages"
          NOVA_SUMMARY_ROW_0_DETAIL: "${{ steps.deploy-pages.outputs.page_url || '' }}"
        run: |
          {
            printf "summary_work_0=%s\\n" "$NOVA_SUMMARY_ROW_0_WORK"
            printf "summary_workspace_0=%s\\n" "$NOVA_SUMMARY_ROW_0_WORKSPACE"
            printf "summary_destination_0=%s\\n" "$NOVA_SUMMARY_ROW_0_DESTINATION"
            printf "summary_detail_0=%s\\n" "$NOVA_SUMMARY_ROW_0_DETAIL"
          } >> "$GITHUB_OUTPUT"

  publish-coverage-badge:
    needs: "build"
