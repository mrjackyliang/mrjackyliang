      summary_destination_0: "${{ steps.nova-summary.outputs.summary_destination_0 }}"
      summary_detail_0: "${{ steps.nova-summary.outputs.summary_detail_0 }}"
    steps:
      - name: "Checkout repository"
        uses: "actions/checkout@v7"
        timeout-minutes: 5

      - name: "Download coverage badge"
        uses: "actions/download-artifact@v8"
        timeout-minutes: 30
        continue-on-error: true
        with:
          name: "coverage-badge"
          path: "coverage-badge"

      - name: "Push coverage badge"
        if: "${{ env.PUBLISH == 'true' }}"
        timeout-minutes: 30
        run: |
          if [ ! -f coverage-badge/coverage.json ]; then
            echo "[Badge] No coverage badge was built, so the badges branch is unchanged."
            exit 0
          fi

          cp coverage-badge/coverage.json "$RUNNER_TEMP/coverage.json"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git ls-remote --exit-code --heads origin badges > /dev/null; then
            git fetch --depth=1 origin badges
            git checkout -B badges FETCH_HEAD
          else
            git switch --orphan badges
          fi

          cp "$RUNNER_TEMP/coverage.json" coverage.json
          git add coverage.json

          if git diff --cached --quiet; then
            echo "[Badge] The coverage badge is already up to date."
            exit 0
          fi

          git commit -m "Update coverage badge"
          git push origin badges

      - name: "Expose Nova summary rows"
        id: "nova-summary"
        if: "${{ always() }}"
        timeout-minutes: 5
        env:
          NOVA_SUMMARY_ROW_0_WORK: "Publish coverage badge"
          NOVA_SUMMARY_ROW_0_WORKSPACE: "-"
          NOVA_SUMMARY_ROW_0_DESTINATION: "badges branch"
          NOVA_SUMMARY_ROW_0_DETAIL: "${{ github.event.release.tag_name || inputs.tag || github.ref_name }}"
        run: |
          {
            printf "summary_work_0=%s\\n" "$NOVA_SUMMARY_ROW_0_WORK"
            printf "summary_workspace_0=%s\\n" "$NOVA_SUMMARY_ROW_0_WORKSPACE"
            printf "summary_destination_0=%s\\n" "$NOVA_SUMMARY_ROW_0_DESTINATION"
            printf "summary_detail_0=%s\\n" "$NOVA_SUMMARY_ROW_0_DETAIL"
          } >> "$GITHUB_OUTPUT"

  summary:
