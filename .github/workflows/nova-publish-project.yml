        timeout-minutes: 10

      - name: "Upload artifact to GitHub Pages"
        if: "${{ env.PUBLISH == 'true' && env.PAGES_ENABLED == 'true' }}"
        uses: "actions/upload-pages-artifact@v5"
        timeout-minutes: 30
        with:
          path: "build/website"

