          NOVA_SUMMARY_ROW_3_DESTINATION: "badges branch"
          NOVA_SUMMARY_ROW_3_DESTINATION_OUTPUT: "${{ needs['publish-coverage-badge'].outputs.summary_destination_0 || '' }}"
          NOVA_SUMMARY_ROW_3_DETAIL_OUTPUT: "${{ needs['publish-coverage-badge'].outputs.summary_detail_0 || '' }}"
